name: Build Spotfire Timeline Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Timeline Mod
        run: npm run build

      - name: Create MOD package
        run: |
          cd dist
          zip -r ../timeline-custom.mod .

      - name: Upload compiled Mod
        uses: actions/upload-artifact@v4
        with:
          name: timeline-custom
          path: timeline-custom.mod